<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1"><meta name=apple-mobile-web-app-capable content=yes><title>APPLE-OS</title><style>body{margin:0;background:#000;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden;background:radial-gradient(120% 120% at 30% 20%,#1e3a8a 0%,#0f172a 40%,#000 100%)}#top{display:flex;justify-content:space-between;padding:12px 22px;color:#fff;font-size:13px;font-weight:600}.clock{font-size:72px;font-weight:200;color:#fff;text-align:center;margin-top:70px;letter-spacing:-2px}.date{text-align:center;color:rgba(255,255,255,.6);margin-top:6px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:32px 26px;margin-top:10px}.ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff;box-shadow:0 10px 20px rgba(0,0,0,.3)}.lbl{color:#fff;font-size:11px;text-align:center;margin-top:6px;display:block}.dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:14px;background:rgba(255,255,255,.18);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:12px 18px;border-radius:28px;border:1px solid rgba(255,255,255,.15)}</style></head><body><div id=top><span>Pas de SIM</span><span id=t2>23:33</span><span>48%</span></div><div class=clock id=clk>23:33</div><div class=date>APPLE-OS • Aujourd'hui</div><div class=grid><div><div class=ic style="background:linear-gradient(#5AC8FA,#007AFF)">📞</div><span class=lbl>Tél</span></div><div><div class=ic style="background:linear-gradient(#4CD964,#34C759)">💬</div><span class=lbl>Messages</span></div><div><div class=ic style="background:linear-gradient(#FF3B30,#FF2D55)">🎵</div><span class=lbl>Musique</span></div><div><div class=ic style="background:linear-gradient(#FFCC00,#FF9500)">📸</div><span class=lbl>Photos</span></div><div><div class=ic style="background:#fff;color:#000"></div><span class=lbl>OS</span></div><div><div class=ic style="background:linear-gradient(#8E8E93,#5856D6)">⚙️</div><span class=lbl>Réglages</span></div></div><div class=dock><div class=ic style="background:linear-gradient(#5AC8FA,#007AFF);width:54px;height:54px">📞</div><div class=ic style="background:linear-gradient(#4CD964,#34C759);width:54px;height:54px">💬</div><div class=ic style="background:linear-gradient(#FF9500,#FF3B30);width:54px;height:54px">🔥</div><div class=ic style="background:linear-gradient(#AF52DE,#5856D6);width:54px;height:54px">📷</div></div><script>setInterval(()=>{let d=new Date(),h=d.getHours(),m=(''+d.getMinutes()).padStart(2,'0');clk.textContent=t2.textContent=h+':'+m},1000)</script></body></html>
